name: Build map packs

# Cuts state packs out of the Protomaps planet build and publishes them, so the
# app can download one file instead of reconstructing a state from tens of
# thousands of range requests.
#
# Measured on the app's own extractor: Oregon is 65,160 requests averaging
# 8.2 KB — over twenty minutes of request overhead on a phone connection. That
# work happens here now, once per rebuild rather than once per install, which is
# also a large net reduction in traffic to somebody else's free server.
#
# Lives in this repo rather than in pl0xuee/griddown so the default GITHUB_TOKEN
# can publish releases here. Running it from the app repo would have needed a
# personal access token as a secret; this needs nothing.

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated state codes, or 'starter' for the bundled overview"
        default: "DC,RI"
        required: true
      maxzoom:
        description: "Maximum zoom (the app asks for 15)"
        default: "15"
        required: true
      tag:
        description: "Release to add to, e.g. packs-20261014 — blank for a new one dated today. For re-running failed states into an earlier run's release."
        default: ""
        required: false

# One build at a time. Two concurrent runs would race on the same release tag,
# and both would be hammering the same public server.
concurrency: build-packs

# Read-only unless a job says otherwise. Every job here does write — they all
# touch the release — but saying so per job means a job added later starts
# with nothing.
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Inputs arrive through env, never pasted into the script: `${{ }}` is
      # substituted into the shell source before it runs, so a state list with a
      # quote in it would have been code.
      - name: Work out the tag and the matrix
        id: plan
        env:
          STATES: ${{ inputs.states }}
          TAG: ${{ inputs.tag }}
        run: |
          # A re-run of failed states used to have to happen on the same UTC
          # day, because the tag is the date and a later run made a new release
          # holding only the re-run states. Naming the release lets it add to
          # the one that is missing them.
          if [ -n "$TAG" ]; then
            if ! printf '%s' "$TAG" | grep -Eq '^packs-[0-9]{8}$'; then
              echo "::error::tag must look like packs-YYYYMMDD, got '$TAG'"; exit 1
            fi
            tag="$TAG"
          else
            tag="packs-$(date -u +%Y%m%d)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # "DC,RI" -> ["DC","RI"], for the matrix below. Codes only: anything
          # else in the list is refused rather than carried into job names.
          matrix=$(printf '%s' "$STATES" \
            | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -v '^$' \
            | python3 -c 'import json,re,sys; s=[l.strip() for l in sys.stdin]; bad=[x for x in s if not re.fullmatch(r"[A-Z]{2}|starter",x)]; sys.exit(f"not a state code: {bad}") if bad else print(json.dumps(s))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "tag $tag, states $matrix"

      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.plan.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists — adding to it"
          else
            # --latest=false is load-bearing, as it is in build-mvum.yml. The app
            # reads releases/latest/download/packs.json; created the ordinary
            # way, this release became Latest the moment it existed, hours
            # before it held a manifest, and every download in that window 404'd
            # and fell back to slow live extraction. It is promoted by the
            # manifest job once it is whole, and until then the previous release
            # keeps serving.
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --latest=false \
              --title "Map packs $tag" \
              --notes "Pre-built GridDown map packs. See packs.json for the manifest the app reads."
          fi

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    # Uploads its pack straight to the release: a state is up to 1.5 GB, and
    # handing 24 GB through artifacts to a separate publishing job would double
    # the transfer. The third-party actions below are pinned by SHA for that
    # reason — they run beside a token that can write releases.
    permissions:
      contents: write
    strategy:
      # One failure should not throw away the packs that did build — they are
      # expensive, and a state can fail on its own for its own reasons.
      fail-fast: false
      # Four at a time: enough to keep the job moving, restrained enough not to
      # point sixty-four concurrent connections at a free public server.
      max-parallel: 4
      matrix:
        state: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      # Pinned by commit, with the version beside it. A tag can be moved to
      # different code after the fact; a commit cannot.
      - name: Check out the app, for its extractor and state list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pl0xuee/griddown
          # The app repo is public and nothing here pushes to it, so there is
          # no reason to leave a write token in .git/config for later steps.
          persist-credentials: false

      # rust-toolchain chooses the toolchain from the ref it is called by, so
      # pinned to a commit it has to be told.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev

      - name: Build the extractor
        working-directory: src-tauri
        run: cargo build --release --bin build-pack

      - name: Cut the pack
        id: cut
        env:
          STATE: ${{ matrix.state }}
          MAXZOOM: ${{ inputs.maxzoom }}
        run: |
          state="$STATE"
          if [ "$state" = "starter" ]; then
            # The whole US at low zoom, bundled in the app so a fresh install
            # opens on a real map. ~11 MB at zoom 6.
            args="-179,18,-66,72"
            zoom=6
            name="starter"
          else
            args="$state"
            name="$state"
            # A state may ask to be cut shallower than the run's zoom. The app
            # reads the same field from this same file, so the pack is cut at
            # exactly the zoom the app will ask for — which keeps the manifest's
            # zoom check meaningful instead of forcing it to be relaxed. Alaska
            # is the only one: at z15 it is 19.6 M tiles, fourteen times
            # California, and does not fit in the six-hour job limit.
            zoom=$(python3 -c "import json,sys; w=int(sys.argv[1]); m=[e.get('maxzoom',w) for e in json.load(open('public/states.json')) if e['abbr']==sys.argv[2]]; print(min(m[0],w) if m else w)" "$MAXZOOM" "$state")
          fi

          out="$name.pmtiles"
          ./src-tauri/target/release/build-pack "$args" public/states.json "$out" "$zoom" \
            | tee /tmp/result.txt

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "zoom=$zoom" >> "$GITHUB_OUTPUT"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "bytes=$(grep '^bytes=' /tmp/result.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "planet=$(grep '^planet=' /tmp/result.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$out" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            "${{ steps.cut.outputs.file }}" \
            --repo "$GITHUB_REPOSITORY" --clobber

      # A fragment per pack rather than one shared file: matrix jobs cannot
      # write to each other, so the manifest is assembled at the end from these.
      - name: Record it for the manifest
        run: |
          mkdir -p fragments
          cat > "fragments/${{ steps.cut.outputs.name }}.json" <<JSON
          {
            "name": "${{ steps.cut.outputs.name }}",
            "bytes": ${{ steps.cut.outputs.bytes }},
            "maxzoom": ${{ steps.cut.outputs.zoom }},
            "sha256": "${{ steps.cut.outputs.sha256 }}",
            "planet": "${{ steps.cut.outputs.planet }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/${{ steps.cut.outputs.file }}"
          }
          JSON
          cat "fragments/${{ steps.cut.outputs.name }}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fragment-${{ steps.cut.outputs.name }}
          path: fragments/

  manifest:
    needs: [prepare, build]
    # Runs even if some states failed: a manifest listing what did build is more
    # useful than none, and the app falls back to live extraction for the rest.
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fragment-*
          path: fragments
          merge-multiple: true

      - name: Assemble packs.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"

          # Carry forward anything already published under this tag, so adding
          # two states later does not drop the ones built this morning.
          existing='{}'
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
               --pattern packs.json --output old.json 2>/dev/null; then
            existing=$(python3 -c 'import json;print(json.dumps(json.load(open("old.json")).get("packs",{})))')
            echo "merging with $(python3 -c 'import json;print(len(json.loads("""'"$existing"'""")))') existing packs"
          fi

          python3 - "$existing" <<'PY'
          import json, os, sys, glob, datetime
          packs = json.loads(sys.argv[1])
          planet = None
          for f in sorted(glob.glob("fragments/*.json")):
              d = json.load(open(f))
              planet = d.pop("planet", None) or planet
              packs[d.pop("name")] = d
          out = {
              "planetBuild": planet,
              "generated": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "packs": packs,
          }
          json.dump(out, open("packs.json", "w"), indent=2, sort_keys=True)
          print(json.dumps(out, indent=2)[:800])
          PY

          gh release upload "$tag" packs.json --repo "$GITHUB_REPOSITORY" --clobber

      # Only now is this release something the app should be pointed at. The
      # manifest above still runs when some states failed — it records what
      # did build — but a release missing states is not promoted: the app would
      # lose those states' packs and fall back to live extraction for them.
      # Re-run the failed states with `tag` set to this release; that run's
      # manifest job promotes it once nothing is missing.
      - name: Make it the release the app reads
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest

      - name: Say why it was not promoted
        if: needs.build.result != 'success'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "::warning::Some states failed, so $TAG was NOT made Latest — the app keeps reading the previous release. Re-run the failed states with tag=$TAG; that run promotes it."

# Packs are cut from a dated planet build; the manifest records which one.
